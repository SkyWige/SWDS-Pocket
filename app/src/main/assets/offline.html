<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Нет связи</title><link rel="stylesheet" href="app.css">
<style>
body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; text-align: center; }
@media (prefers-color-scheme: dark) { :root { --bg: #0b1020; --surface: #151b2e; --text: #e5e9f5; --muted: #94a3b8; --accent: #60a5fa; } }
.big { font-size: 56px; margin-bottom: 8px; }
</style></head>
<body>
<div style="max-width:420px">
  <div class="big">📡</div>
  <h2 style="margin:0 0 6px">SWDS не отвечает</h2>
  <p class="muted" id="why"></p>
  <p class="muted">Проверьте, что компьютер с SWDS включён, а телефон в той же сети. Вне дома нужен внешний адрес сервера (Настройки → Адреса).</p>
  <div class="btns" style="justify-content:center">
    <button class="btn pri" onclick="window.SWDSPocket && SWDSPocket.retry()">Повторить</button>
    <button class="btn" onclick="window.SWDSPocket && SWDSPocket.openSettings()">Настройки</button>
  </div>
  <p class="muted" style="margin-top:18px">Уведомления продолжат приходить, когда связь появится.</p>
</div>
<script>document.getElementById("why").textContent = decodeURIComponent(location.hash.slice(1) || "");</script>
</body></html>

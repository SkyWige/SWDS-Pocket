<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Библиотека</title><link rel="stylesheet" href="app.css">
<style>
:root { --r: 18px; --ease: cubic-bezier(.2, .8, .2, 1); --shadow: 0 1px 2px rgba(0,0,0,.08), 0 10px 26px -14px rgba(0,0,0,.45); }
html { scroll-behavior: smooth; }
body { padding: 0 0 calc(40px + env(safe-area-inset-bottom)); overscroll-behavior-y: contain; }
button { font: inherit; color: inherit; }
.wrap { padding: 0 16px; max-width: 820px; margin: 0 auto; }

/* шапка */
.hd { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  padding: calc(10px + env(safe-area-inset-top)) 16px 10px; transition: box-shadow .25s; }
.hd.sc { box-shadow: 0 1px 0 var(--line); }
.hd-row { display: flex; align-items: center; gap: 8px; max-width: 820px; margin: 0 auto; }
.hd h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -.02em; flex: 1; transition: font-size .25s var(--ease); }
.hd.sc h1 { font-size: 19px; }
.ib { width: 40px; height: 40px; border-radius: 12px; border: 0; background: var(--surface); box-shadow: 0 0 0 1px var(--line); display: grid; place-items: center; font-size: 17px; cursor: pointer; transition: transform .15s; }
.ib:active { transform: scale(.92); }
.ib.spin span { display: inline-block; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.sub { font-size: 13px; color: var(--muted); max-width: 820px; margin: 2px auto 0; display: flex; gap: 8px; align-items: center; min-height: 18px; }
.dl { max-width: 820px; margin: 8px auto 0; display: none; align-items: center; gap: 10px; font-size: 12.5px; color: var(--muted); }
.dl.on { display: flex; animation: fadeIn .3s var(--ease); }
.dl .pb { flex: 1; height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; }
.dl .pb i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .5s var(--ease); }
.dl .pb.ind i { width: 35%; animation: indet 1.2s ease-in-out infinite; }
@keyframes indet { from { transform: translateX(-100%); } to { transform: translateX(290%); } }

/* поиск и фильтры */
.tools { display: flex; gap: 8px; margin: 6px 0 10px; }
.sbox { flex: 1; position: relative; }
.sbox input { padding-left: 38px; padding-right: 36px; border-radius: 14px; background: var(--surface); }
.sbox .si { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); opacity: .5; pointer-events: none; }
.sbox .sx { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: 0; background: none; width: 30px; height: 30px; border-radius: 50%; opacity: .55; display: none; }
.sbox.has .sx { display: block; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px 0 10px; margin: 0 -16px; padding-left: 16px; padding-right: 16px; flex-wrap: nowrap; }
.chips::-webkit-scrollbar { display: none; }
.chips button { flex: none; padding: 8px 14px; border-radius: 99px; border: 0; box-shadow: 0 0 0 1px var(--line); background: var(--surface); font-size: 13.5px; font-weight: 600;
  transition: background .2s, color .2s, transform .15s; }
.chips button:active { transform: scale(.95); }
.chips button.on { background: var(--accent); color: #fff; box-shadow: none; }
.chips button small { opacity: .7; font-weight: 500; margin-left: 3px; }

/* продолжить чтение */
.h { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 18px 2px 10px; display: flex; align-items: center; }
.h .sp { flex: 1; }
.hero { position: relative; display: flex; gap: 16px; padding: 16px; border-radius: 22px; overflow: hidden; color: #fff; cursor: pointer; box-shadow: var(--shadow);
  background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 85%, #000), color-mix(in srgb, var(--accent) 45%, #0b1020)); transition: transform .2s var(--ease); }
.hero:active { transform: scale(.985); }
.hero .bg { position: absolute; inset: -20px; background-size: cover; background-position: center; filter: blur(28px) saturate(1.3); opacity: .45; }
.hero > * { position: relative; }
.hero .cv { width: 92px; flex: none; }
.hero .bd { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.hero .k { font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; opacity: .8; }
.hero b { font-size: 18px; line-height: 1.2; margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.hero small { opacity: .85; font-size: 13px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hero .go { margin-top: auto; display: flex; align-items: center; gap: 10px; padding-top: 12px; }
.hero .go .pb { flex: 1; height: 6px; border-radius: 6px; background: rgba(255,255,255,.25); overflow: hidden; }
.hero .go .pb i { display: block; height: 100%; background: #fff; border-radius: 6px; }
.hero .go span { font-weight: 800; font-size: 13px; }
.cont { display: grid; grid-auto-flow: column; grid-auto-columns: 74%; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 10px 16px 4px; margin: 0 -16px;
  scrollbar-width: none; scroll-padding: 16px; }
.cont::-webkit-scrollbar { display: none; }
.cc { display: flex; gap: 12px; background: var(--surface); border-radius: var(--r); padding: 10px; scroll-snap-align: start; box-shadow: 0 0 0 1px var(--line); cursor: pointer; transition: transform .2s var(--ease); }
.cc:active { transform: scale(.97); }
.cc .cv { width: 50px; flex: none; }
.cc .bd { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.cc b { font-size: 14px; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.cc small { color: var(--muted); font-size: 12px; }
.mini { height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; margin-top: auto; } .mini i { display: block; height: 100%; background: var(--accent); }

/* сетка и список */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 18px 14px; }
.bk { min-width: 0; cursor: pointer; -webkit-user-select: none; user-select: none; animation: rise .45s var(--ease) both; animation-delay: calc(var(--i, 0) * 28ms); }
.bk .cv { transition: transform .2s var(--ease), box-shadow .2s; }
.bk:active .cv { transform: scale(.95); }
.bk .t { font-size: 12.8px; font-weight: 700; line-height: 1.25; margin-top: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.bk .a { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
@keyframes rise { from { opacity: 0; transform: translateY(10px) scale(.98); } }
@keyframes fadeIn { from { opacity: 0; } }
.list { display: flex; flex-direction: column; gap: 2px; }
.li { display: flex; gap: 12px; align-items: center; padding: 8px; border-radius: 14px; cursor: pointer; animation: rise .4s var(--ease) both; animation-delay: calc(var(--i, 0) * 20ms); transition: background .15s; }
.li:active { background: var(--surface); }
.li .cv { width: 46px; flex: none; }
.li .bd { flex: 1; min-width: 0; }
.li b { display: block; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.li small { display: block; color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.li .mini { margin-top: 6px; }
.li .mo { border: 0; background: none; width: 36px; height: 36px; border-radius: 50%; font-size: 18px; color: var(--muted); }

/* обложка */
.cv { position: relative; aspect-ratio: 2/3; border-radius: 4px 10px 10px 4px; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,.18), 0 10px 20px -10px rgba(0,0,0,.55); background: #334155; }
.cv img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; transition: opacity .4s; }
.cv img.ld { opacity: 1; }
.cv::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 7%; z-index: 2; background: linear-gradient(90deg, rgba(0,0,0,.28), rgba(255,255,255,.14) 55%, transparent); }
.cv::after { content: ""; position: absolute; inset: 0; z-index: 2; background: linear-gradient(160deg, rgba(255,255,255,.14), transparent 40%); pointer-events: none; }
.cv .gen { position: absolute; inset: 0; padding: 18% 10% 10% 14%; color: #fff; display: flex; flex-direction: column; }
.cv .gen .gt { font: 700 12px/1.15 Georgia, serif; display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; text-shadow: 0 1px 2px rgba(0,0,0,.3); }
.cv .gen .ga { margin-top: auto; font-size: 9.5px; opacity: .85; }
.cv .gen .gi { font-size: 22px; margin-bottom: 6px; opacity: .9; }
.cv .fmt { position: absolute; z-index: 3; right: 5px; top: 5px; font: 800 8.5px/1 sans-serif; padding: 3px 5px; border-radius: 5px; background: rgba(0,0,0,.55); color: #fff; letter-spacing: .03em; }
.cv .pr { position: absolute; z-index: 3; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(0,0,0,.35); } .cv .pr i { display: block; height: 100%; background: var(--accent); }
.cv .badge { position: absolute; z-index: 4; left: 8px; top: 5px; min-width: 22px; height: 22px; border-radius: 11px; display: grid; place-items: center; font-size: 11px; color: #fff;
  background: rgba(15,23,42,.72); backdrop-filter: blur(6px); padding: 0 6px; }
.cv .badge.done { background: #16a34a; }
.cv.off img, .cv.off .gen { filter: grayscale(.55) brightness(.8); }
.cv .busy { position: absolute; inset: 0; z-index: 5; background: rgba(0,0,0,.45); display: grid; place-items: center; animation: fadeIn .25s; }
.cv .busy i { width: 26px; height: 26px; border-radius: 50%; border: 3px solid rgba(255,255,255,.3); border-top-color: #fff; animation: spin .8s linear infinite; }
.cv.mini-cv .fmt, .cv.mini-cv .badge, .cv.mini-cv .gt, .cv.mini-cv .ga { display: none; }
.cv.mini-cv .gen { padding: 0; align-items: center; justify-content: center; } .cv.mini-cv .gen .gi { margin: 0; font-size: 18px; }

/* скелет */
.sk .cv { background: linear-gradient(100deg, var(--surface) 30%, color-mix(in srgb, var(--text) 7%, var(--surface)) 50%, var(--surface) 70%); background-size: 300% 100%; animation: shimmer 1.3s infinite; box-shadow: 0 0 0 1px var(--line); }
.sk .t, .sk .a { height: 10px; border-radius: 5px; background: var(--line); margin-top: 8px; } .sk .a { width: 60%; }
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }

.empty { text-align: center; padding: 50px 22px; color: var(--muted); animation: fadeIn .4s; }
.empty .ic { font-size: 54px; } .empty b { display: block; color: var(--text); font-size: 18px; margin: 10px 0 6px; } .empty p { margin: 0 0 16px; line-height: 1.5; }

/* листы */
.dim { position: fixed; inset: 0; z-index: 19; background: rgba(0,0,0,.42); opacity: 0; pointer-events: none; transition: opacity .25s; }
.dim.on { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-radius: 24px 24px 0 0; max-height: 88vh; overflow-y: auto;
  padding: 8px 18px calc(22px + env(safe-area-inset-bottom)); box-shadow: 0 -12px 40px rgba(0,0,0,.3); transform: translateY(105%); transition: transform .32s var(--ease);
  max-width: 820px; margin: 0 auto; overscroll-behavior: contain; }
.sheet.on { transform: none; }
.sheet.drag { transition: none; }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 4px auto 12px; }
.sheet h3 { margin: 0 0 6px; font-size: 18px; }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); font-size: 15px; }
.row:first-of-type { border-top: 0; }
.row .t { flex: 1; min-width: 0; } .row .t small { display: block; color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.seg { display: flex; background: color-mix(in srgb, var(--text) 6%, var(--surface)); border-radius: 12px; padding: 3px; gap: 2px; }
.seg button { flex: 1; border: 0; background: none; padding: 8px 10px; border-radius: 9px; font-size: 13px; font-weight: 600; color: var(--muted); transition: background .2s, color .2s; }
.seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }

/* карточка книги */
.det { display: flex; gap: 16px; padding: 4px 0 14px; }
.det .cv { width: 104px; flex: none; }
.det .info { flex: 1; min-width: 0; }
.det h3 { font-size: 19px; line-height: 1.22; }
.det .au { color: var(--muted); font-size: 14px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.tag { font-size: 11.5px; font-weight: 700; padding: 4px 8px; border-radius: 8px; background: color-mix(in srgb, var(--text) 7%, transparent); color: var(--muted); }
.tag.a { background: var(--soft); color: var(--accent); }
.desc { font-size: 14px; line-height: 1.55; color: color-mix(in srgb, var(--text) 85%, var(--muted)); max-height: 7.8em; overflow: hidden; position: relative; transition: max-height .35s var(--ease); }
.desc.open { max-height: 80em; }
.desc:not(.open)::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2.4em; background: linear-gradient(transparent, var(--surface)); }
.acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
.acts .btn { padding: 13px 10px; border-radius: 14px; }
.acts .wide { grid-column: 1 / -1; }
.btn { transition: transform .15s, filter .2s; } .btn:active { transform: scale(.97); }
.prog-row { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: 12.5px; color: var(--muted); }
.prog-row .mini { flex: 1; height: 6px; margin: 0; }

.toast { border-radius: 14px; animation: rise .3s var(--ease); bottom: calc(22px + env(safe-area-inset-bottom)); }
.ptr { height: 0; overflow: hidden; display: grid; place-items: center; color: var(--muted); font-size: 13px; transition: height .2s; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style></head>
<body>
<header class="hd" id="hd">
  <div class="hd-row"><h1>Библиотека</h1>
    <button class="ib" id="viewb" title="Вид"><span>▦</span></button>
    <button class="ib" id="syncb" title="Синхронизировать"><span>⟳</span></button>
    <button class="ib" id="setb" title="Настройки"><span>⚙</span></button></div>
  <div class="sub" id="sub">Книги в телефоне — читаются без связи</div>
  <div class="dl" id="dl"><span id="dlt"></span><span class="pb" id="dlpb"><i id="dlb"></i></span></div>
</header>
<div class="ptr" id="ptr">↓ Потяните, чтобы обновить</div>
<main class="wrap">
  <section id="contw" style="display:none">
    <div class="h">Продолжить чтение</div>
    <div id="hero"></div>
    <div class="cont" id="cont"></div>
  </section>
  <div class="h" style="margin-top:20px"><span>Все книги</span><span class="sp"></span><button class="btn sm" id="sortb" style="padding:5px 10px">↕ <span id="sortl">Недавние</span></button></div>
  <div class="tools"><label class="sbox" id="sbox"><span class="si">🔍</span><input type="text" id="q" placeholder="Название, автор, серия" autocomplete="off"><button class="sx" id="qx" type="button">✕</button></label></div>
  <div class="chips" id="chips"></div>
  <div id="books"></div>
</main>

<div class="dim" id="dim"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div id="sheetb"></div></div>

<script src="app.js"></script>
<script>
let L = { books: [] }, loaded = false, filter = "", q = "", pending = "", lastLocal = {};
const pref = { get: (k, d) => { try { const v = localStorage.getItem("lib." + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
               set: (k, v) => { try { localStorage.setItem("lib." + k, JSON.stringify(v)); } catch (e) { /* */ } } };
let view = pref.get("view", "grid"), sort = pref.get("sort", "recent");
const ICON = { pdf: "📕", xlsx: "📊", xls: "📊", csv: "📊", ods: "📊", docx: "📄", doc: "📄", odt: "📄", rtf: "📄", pptx: "📽", cbz: "🖼", txt: "📝", md: "📝", epub: "📖", fb2: "📖", djvu: "📜", mobi: "📗" };
const ST = { reading: "Читаю", want: "Хочу прочитать", done: "Прочитано", new: "Новая", paused: "Отложена", dropped: "Брошена" };
const SORTS = { recent: "Недавние", title: "Название", author: "Автор", progress: "Прогресс", added: "Скачанные" };
function hue(s) { let h = 0; for (const c of String(s || "")) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h % 360; }
function plural(n, a, b, c) { const m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? a : m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14) ? b : c; }
const pct = b => Math.round((b.progress || 0) * 100);
const fmtOf = b => String(b.fmt || "").toLowerCase().replace(".zip", "");

function cover(b, o = {}) {
  const fm = fmtOf(b).toUpperCase();
  const prog = b.progress > 0 && b.status !== "done" ? `<span class="pr"><i style="width:${pct(b)}%"></i></span>` : "";
  const badge = b.status === "done" ? '<span class="badge done">✓</span>' : !b.local ? '<span class="badge">☁</span>' : "";
  const busy = b.downloading || pending === b.id ? '<span class="busy"><i></i></span>' : "";
  const cls = "cv" + (b.local ? "" : " off") + (o.mini ? " mini-cv" : "");
  const h = hue((b.author || "") + b.title);
  const gen = `<div class="gen" style="background:linear-gradient(160deg,hsl(${h} 46% 38%),hsl(${(h + 40) % 360} 52% 17%))"><div class="gi">${ICON[fmtOf(b)] || "📘"}</div><div class="gt">${esc(b.title)}</div><div class="ga">${esc(b.author || "")}</div></div>`;
  const img = b.cover_file ? `<img src="${esc(b.cover_file)}" alt="" loading="lazy" onload="this.classList.add('ld')" onerror="this.remove()">` : "";
  return `<div class="${cls}">${gen}${img}<span class="fmt">${esc(fm)}</span>${prog}${badge}${busy}</div>`;
}

/* ───────── отрисовка ───────── */
function sorted(list) {
  const by = {
    recent: (a, b) => (b.opened_at || 0) - (a.opened_at || 0) || (b.downloaded_at || 0) - (a.downloaded_at || 0) || String(a.title).localeCompare(b.title, "ru"),
    title: (a, b) => String(a.title).localeCompare(b.title, "ru"),
    author: (a, b) => String(a.author || "яяя").localeCompare(b.author || "яяя", "ru") || String(a.title).localeCompare(b.title, "ru"),
    progress: (a, b) => (b.progress || 0) - (a.progress || 0),
    added: (a, b) => (b.downloaded_at || 0) - (a.downloaded_at || 0),
  }[sort] || (() => 0);
  return list.slice().sort(by);
}
function render() {
  const books = L.books;
  const local = books.filter(b => b.local).length;
  $("sub").innerHTML = books.length ? `${local} из ${books.length} ${plural(books.length, "книги", "книг", "книг")} в телефоне · ${human(L.bytes) || "0 Б"}`
    + (L.outbox ? ` · <span class="pill warn">ждут отправки: ${L.outbox}</span>` : "") : "Книги в телефоне — читаются без связи";
  const dl = !!L.status;
  $("dl").classList.toggle("on", dl);
  $("syncb").classList.toggle("spin", dl);
  if (dl) {
    $("dlt").textContent = L.status + (L.total ? ` · ${L.done} из ${L.total}` : "");
    $("dlpb").classList.toggle("ind", !L.total);
    $("dlb").style.width = L.total ? Math.round(L.done / L.total * 100) + "%" : "";
  }
  // продолжить чтение
  const reading = books.filter(b => b.local && b.status === "reading").sort((a, b) => (b.opened_at || 0) - (a.opened_at || 0));
  $("contw").style.display = reading.length && !q ? "" : "none";
  if (reading.length) {
    const r0 = reading[0];
    $("hero").innerHTML = `<div class="hero" data-id="${esc(r0.id)}">${r0.cover_file ? `<div class="bg" style="background-image:url('${esc(r0.cover_file)}')"></div>` : ""}
      ${cover(r0)}<div class="bd"><span class="k">${r0.opened_at ? "Вы остановились здесь" : "Читаю"}</span><b>${esc(r0.title)}</b><small>${esc(r0.author || "")}</small>
      <div class="go"><span class="pb"><i style="width:${pct(r0)}%"></i></span><span>${pct(r0)}%</span><span>Читать ›</span></div></div></div>`;
    $("cont").innerHTML = reading.slice(1).map(b => `<div class="cc" data-id="${esc(b.id)}">${cover(b, { mini: true })}<div class="bd"><b>${esc(b.title)}</b><small>${esc(b.author || "")}</small>
      <div class="mini"><i style="width:${pct(b)}%"></i></div><small>${pct(b)}%</small></div></div>`).join("");
    $("cont").style.display = reading.length > 1 ? "" : "none";
  }
  // фильтры
  const count = f => books.filter(f).length;
  const groups = [["", "Все", books.length], ["local", "📱 В телефоне", local], ["reading", "Читаю", count(b => b.status === "reading")],
    ["want", "Хочу", count(b => b.status === "want")], ["done", "Прочитано", count(b => b.status === "done")],
    ["pdf", "PDF", count(b => fmtOf(b) === "pdf")], ["table", "Таблицы", count(b => b.kind === "table")], ["cloud", "☁ Не скачаны", books.length - local]]
    .filter(g => !g[0] || g[2]);
  $("chips").innerHTML = groups.map(([k, l, n]) => `<button data-f="${k}" class="${filter === k ? "on" : ""}">${l}${k ? `<small>${n}</small>` : ""}</button>`).join("");
  $("sortl").textContent = SORTS[sort];
  $("viewb").firstElementChild.textContent = view === "grid" ? "☰" : "▦";
  // книги
  const ql = q.toLowerCase();
  const list = sorted(books.filter(b => {
    if (filter === "local" && !b.local) return false;
    if (filter === "cloud" && b.local) return false;
    if (filter && !["local", "cloud"].includes(filter) && b.status !== filter && fmtOf(b) !== filter && b.kind !== filter) return false;
    return !ql || [b.title, b.author, b.series].join(" ").toLowerCase().includes(ql);
  }));
  if (!loaded) { $("books").innerHTML = `<div class="grid">${Array.from({ length: 9 }, () => '<div class="bk sk"><div class="cv"></div><div class="t"></div><div class="a"></div></div>').join("")}</div>`; return; }
  if (!list.length) {
    $("books").innerHTML = books.length ? `<div class="empty"><div class="ic">🔎</div><b>Ничего не нашлось</b><p>Попробуйте другое слово или фильтр.</p></div>`
      : `<div class="empty"><div class="ic">📚</div><b>Пока нет книг</b><p>В SWDS откройте «Библиотеку» → «📁 Папки» и отметьте «📱 На телефон» или добавьте книгу на полку с отметкой 📱. Книги, которые вы читаете, скачиваются сами.</p>
        <button class="btn pri" onclick="P.call('open_main',{path:'/modules/library/window'})">Открыть библиотеку в SWDS</button></div>`;
    return;
  }
  const sub = b => [b.author || (ST[b.status] || ""), b.series ? b.series + (b.series_no ? " #" + b.series_no : "") : ""].filter(Boolean).join(" · ");
  $("books").innerHTML = view === "grid"
    ? `<div class="grid">${list.map((b, i) => `<div class="bk" data-id="${esc(b.id)}" style="--i:${Math.min(i, 24)}">${cover(b)}<div class="t">${esc(b.title)}</div><div class="a">${esc(sub(b) || fmtOf(b).toUpperCase())}</div></div>`).join("")}</div>`
    : `<div class="list">${list.map((b, i) => `<div class="li" data-id="${esc(b.id)}" style="--i:${Math.min(i, 24)}">${cover(b, { mini: true })}<div class="bd"><b>${esc(b.title)}</b>
        <small>${esc(sub(b))}</small><small>${[fmtOf(b).toUpperCase(), b.size ? human(b.size) : "", b.local ? "📱 в телефоне" : "☁ на сервере", b.progress > 0 && b.status !== "done" ? pct(b) + "%" : ""].filter(Boolean).join(" · ")}</small>
        ${b.progress > 0 && b.status !== "done" ? `<div class="mini"><i style="width:${pct(b)}%"></i></div>` : ""}</div><button class="mo" data-more="${esc(b.id)}">⋯</button></div>`).join("")}</div>`;
}

/* ───────── данные ───────── */
async function load() {
  const r = await P.call("lib_list");
  if (r.ok) {
    loaded = true; L = r;
    // книга, которую ждали, скачалась — открываем
    if (pending) {
      const b = L.books.find(x => x.id === pending);
      if (b && b.local) { const id = pending; pending = ""; toast("«" + b.title + "» готова"); openBook(id); }
      else if (!L.status && Date.now() - (window.pendT || 0) > 30000) { pending = ""; toast("Не удалось скачать — проверьте связь с SWDS"); }
    }
    render();
  }
  return r;
}
let pollT;
async function poll() { clearTimeout(pollT); const r = await load(); if (r.status || pending) pollT = setTimeout(poll, 900); }

async function openBook(id) {
  const b = L.books.find(x => x.id === id);
  if (!b) return;
  const r = await P.call("open_reader", { id });
  if (!r.ok) { toast(r.error || "Не получилось открыть"); return; }
  if (r.downloading) {
    pending = id; window.pendT = Date.now();
    toast("Скачиваю «" + b.title + "» — откроется сама");
    render(); setTimeout(poll, 600);
  }
}

/* ───────── карточка книги ───────── */
function sheet(html) {
  $("sheetb").innerHTML = html;
  $("sheet").scrollTop = 0;
  $("sheet").classList.add("on"); $("dim").classList.add("on");
}
function closeSheet() { $("sheet").classList.remove("on"); $("dim").classList.remove("on"); }
function details(id) {
  const b = L.books.find(x => x.id === id); if (!b) return;
  const tags = [ST[b.status] ? `<span class="tag a">${ST[b.status]}</span>` : "", `<span class="tag">${esc(fmtOf(b).toUpperCase())}</span>`,
    b.size ? `<span class="tag">${human(b.size)}</span>` : "", b.pages ? `<span class="tag">${b.pages} стр.</span>` : "", b.year ? `<span class="tag">${esc(b.year)}</span>` : "",
    b.favorite ? '<span class="tag">★ избранное</span>' : "", b.local ? '<span class="tag">📱 в телефоне</span>' : '<span class="tag">☁ на сервере</span>'].join("");
  const canOther = ["pdf", "djvu", "mobi", "doc", "xls", "docx", "xlsx", "pptx", "odt", "ods", "rtf"].includes(fmtOf(b));
  sheet(`<div class="det">${cover(b)}<div class="info"><h3>${esc(b.title)}</h3><div class="au">${esc(b.author || "")}</div>
      ${b.series ? `<div class="au" style="font-size:13px">${esc(b.series)}${b.series_no ? " · книга " + esc(b.series_no) : ""}</div>` : ""}<div class="tags">${tags}</div></div></div>
    ${b.progress > 0 ? `<div class="prog-row"><span>Прочитано</span><span class="mini"><i style="width:${pct(b)}%"></i></span><b>${pct(b)}%</b></div>` : ""}
    ${b.description ? `<div class="desc" id="desc" style="margin-top:12px">${esc(String(b.description).replace(/<[^>]+>/g, " "))}</div>` : ""}
    <div class="acts">
      <button class="btn pri wide" data-act="read">${b.local ? (b.progress > 0 && b.status !== "done" ? "▶ Продолжить чтение" : "📖 Читать") : "⬇ Скачать и открыть"}</button>
      ${b.local && canOther ? '<button class="btn" data-act="other">↗ В другом приложении</button>' : ""}
      ${b.local ? '<button class="btn danger" data-act="del">🗑 Убрать</button>' : '<button class="btn" data-act="dl">⬇ Только скачать</button>'}
      <button class="btn${b.local && canOther ? " wide" : ""}" data-act="web">🌐 Открыть в SWDS</button>
    </div>`);
  $("sheetb").dataset.id = id;
  const d = $("desc"); if (d) d.onclick = () => d.classList.toggle("open");
}
$("sheetb").addEventListener("click", async e => {
  const a = e.target.closest("[data-act]"); if (!a) return;
  const id = $("sheetb").dataset.id, b = L.books.find(x => x.id === id);
  if (a.dataset.act === "read") { closeSheet(); openBook(id); }
  else if (a.dataset.act === "dl") { await P.call("lib_download", { id }); closeSheet(); toast("Скачиваю «" + (b ? b.title : "") + "»"); setTimeout(poll, 600); }
  else if (a.dataset.act === "other") P.call("lib_open_with", { id }).then(r => { if (!r.ok) toast(r.error); });
  else if (a.dataset.act === "del") { if (!confirm("Убрать книгу с телефона? Прогресс и цитаты останутся в SWDS.")) return; await P.call("lib_delete", { id }); closeSheet(); toast("Убрано с телефона"); load(); }
  else if (a.dataset.act === "web") P.call("open_main", { path: "/modules/library/window#book=" + encodeURIComponent(id) });
});

function settings() {
  const s = P.state();
  sheet(`<h3>Библиотека в телефоне</h3>
    <div class="row"><div class="t">Скачивать книги в фоне<small>Какие — решаете в SWDS: папки и полки с отметкой «📱 На телефон» и книги «Читаю»</small></div><label class="sw"><input type="checkbox" id="en" ${s.library_enabled !== false ? "checked" : ""}><span></span></label></div>
    <div class="row"><div class="t">Только по Wi-Fi<small>Прогресс чтения и цитаты уходят по любой сети</small></div><label class="sw"><input type="checkbox" id="wifi" ${s.library_wifi_only !== false ? "checked" : ""}><span></span></label></div>
    <div class="row"><div class="t">Вид списка</div><div class="seg" id="vseg"><button data-v="grid" class="${view === "grid" ? "on" : ""}">▦ Обложки</button><button data-v="list" class="${view === "list" ? "on" : ""}">☰ Список</button></div></div>
    <div class="row"><div class="t">Занято<small>${human(L.bytes || 0) || "0 Б"} · ${L.books.filter(b => b.local).length} книг</small></div><button class="btn sm danger" id="clear">Очистить</button></div>
    <div class="row"><div class="t">Последняя синхронизация<small>${L.synced_at ? new Date(L.synced_at).toLocaleString("ru", { day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" }) : "ещё не было"}</small></div><button class="btn sm" id="sync2">⟳ Сейчас</button></div>
    <button class="btn full" id="srv" style="margin-top:14px">🌐 Открыть библиотеку в SWDS</button>`);
  $("en").onchange = e => P.call("lib_set", { enabled: e.target.checked });
  $("wifi").onchange = e => P.call("lib_set", { wifi_only: e.target.checked });
  $("vseg").onclick = e => { const v = e.target.closest("[data-v]"); if (!v) return; view = v.dataset.v; pref.set("view", view); render(); settings(); };
  $("clear").onclick = async () => { if (!confirm("Удалить скачанные книги с телефона? Прогресс и цитаты сохранятся на сервере.")) return; await P.call("lib_clear"); closeSheet(); load(); };
  $("sync2").onclick = () => { closeSheet(); sync(); };
  $("srv").onclick = () => P.call("open_main", { path: "/modules/library/window" });
}
function sortSheet() {
  sheet(`<h3>Сортировка</h3>${Object.entries(SORTS).map(([k, n]) => `<div class="row" data-sort="${k}" style="cursor:pointer"><div class="t">${n}</div>${sort === k ? "✓" : ""}</div>`).join("")}`);
}
$("sheetb").addEventListener("click", e => { const s = e.target.closest("[data-sort]"); if (s) { sort = s.dataset.sort; pref.set("sort", sort); closeSheet(); render(); } });

/* ───────── жесты ───────── */
let lp = null;
document.addEventListener("pointerdown", e => {
  const el = e.target.closest(".bk,.cc,.hero,.li"); if (!el || e.target.closest("[data-more]")) return;
  lp = { id: el.dataset.id, x: e.clientX, y: e.clientY, fired: false, t: setTimeout(() => { lp.fired = true; navigator.vibrate && navigator.vibrate(12); details(lp.id); }, 480) };
});
document.addEventListener("pointermove", e => { if (lp && Math.hypot(e.clientX - lp.x, e.clientY - lp.y) > 10) { clearTimeout(lp.t); lp = null; } });
document.addEventListener("pointerup", () => { if (lp) clearTimeout(lp.t); });
document.addEventListener("contextmenu", e => { if (e.target.closest(".bk,.cc,.hero,.li")) e.preventDefault(); });
document.addEventListener("click", e => {
  const more = e.target.closest("[data-more]"); if (more) { details(more.dataset.more); return; }
  const b = e.target.closest(".bk,.cc,.hero,.li");
  if (b) {
    if (lp && lp.fired) { lp = null; return; }
    lp = null;
    const book = L.books.find(x => x.id === b.dataset.id);
    if (book && !book.local) details(book.id); else openBook(b.dataset.id);
    return;
  }
  const f = e.target.closest("[data-f]"); if (f) { filter = f.dataset.f; render(); f.scrollIntoView({ inline: "center", behavior: "smooth", block: "nearest" }); }
});
$("dim").onclick = closeSheet;
// лист можно смахнуть вниз
(function () {
  const sh = $("sheet"); let y0 = null, dy = 0;
  sh.addEventListener("touchstart", e => { if (sh.scrollTop > 0) return; y0 = e.touches[0].clientY; dy = 0; }, { passive: true });
  sh.addEventListener("touchmove", e => { if (y0 == null) return; dy = Math.max(0, e.touches[0].clientY - y0); if (dy > 4) { sh.classList.add("drag"); sh.style.transform = `translateY(${dy}px)`; } }, { passive: true });
  sh.addEventListener("touchend", () => { if (y0 == null) return; sh.classList.remove("drag"); sh.style.transform = ""; if (dy > 90) closeSheet(); y0 = null; });
})();
// потянуть вниз — синхронизация
(function () {
  let y0 = null, d = 0; const ptr = $("ptr");
  addEventListener("touchstart", e => { if (scrollY <= 0 && !$("sheet").classList.contains("on")) { y0 = e.touches[0].clientY; d = 0; } }, { passive: true });
  addEventListener("touchmove", e => { if (y0 == null) return; d = e.touches[0].clientY - y0; if (d > 0) { ptr.style.height = Math.min(54, d / 2.2) + "px"; ptr.textContent = d > 110 ? "↻ Отпустите — синхронизирую" : "↓ Потяните, чтобы обновить"; } }, { passive: true });
  addEventListener("touchend", () => { if (y0 == null) return; ptr.style.height = "0"; if (d > 110) sync(); y0 = null; });
})();
addEventListener("scroll", () => $("hd").classList.toggle("sc", scrollY > 8), { passive: true });

async function sync() { await P.call("lib_sync"); toast("Синхронизирую библиотеку…"); setTimeout(poll, 700); }
$("syncb").onclick = sync;
$("setb").onclick = settings;
$("sortb").onclick = sortSheet;
$("viewb").onclick = () => { view = view === "grid" ? "list" : "grid"; pref.set("view", view); render(); };
$("q").oninput = e => { q = e.target.value.trim(); $("sbox").classList.toggle("has", !!q); render(); };
$("qx").onclick = () => { $("q").value = ""; q = ""; $("sbox").classList.remove("has"); render(); };
P.on("resume", () => load());
render();
load().then(r => { if (r.ok && (!r.synced_at || Date.now() - r.synced_at > 10 * 60000)) { P.call("lib_sync", { manual: false }); setTimeout(poll, 1500); } else if (r.status) poll(); });
</script>
</body></html>

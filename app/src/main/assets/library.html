<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Библиотека</title><link rel="stylesheet" href="app.css">
<style>
body { padding: 0 0 40px; }
.hd { padding: 16px 16px 6px; display: flex; gap: 12px; align-items: center; }
.hd .ic { font-size: 30px; } .hd h2 { margin: 0; font-size: 19px; } .hd p { margin: 2px 0 0; font-size: 12.5px; color: var(--muted); } .hd .sp { flex: 1; }
.wrap { padding: 0 14px; max-width: 760px; margin: 0 auto; }
.search { position: sticky; top: 0; z-index: 4; background: var(--bg); padding: 8px 0 10px; display: flex; gap: 8px; }
.search input { flex: 1; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 8px; }
.chips::-webkit-scrollbar { display: none; }
.chips button { flex: none; padding: 7px 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); color: var(--text); font: inherit; font-size: 13.5px; font-weight: 600; }
.chips button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.h { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 16px 2px 8px; }
.cont { display: grid; grid-auto-flow: column; grid-auto-columns: 84%; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 6px; scrollbar-width: none; }
.cc { display: flex; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 12px; scroll-snap-align: start; }
.cc .cv { width: 70px; flex: none; }
.cc .bd { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.cc b { font-size: 15px; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.cc small { color: var(--muted); font-size: 12.5px; }
.bar { height: 6px; border-radius: 6px; background: var(--line); overflow: hidden; margin-top: auto; } .bar i { display: block; height: 100%; background: var(--accent); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(102px, 1fr)); gap: 16px 12px; }
.bk { min-width: 0; } .bk .t { font-size: 12.5px; font-weight: 700; line-height: 1.25; margin-top: 7px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.bk .a { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cv { position: relative; aspect-ratio: 2/3; border-radius: 5px 9px 9px 5px; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,.2), 0 8px 18px -8px rgba(0,0,0,.5); background: #334155; }
.cv img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cv::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 7%; z-index: 2; background: linear-gradient(90deg, rgba(0,0,0,.28), rgba(255,255,255,.12) 55%, transparent); }
.cv .gen { position: absolute; inset: 0; padding: 20% 10% 10% 14%; color: #fff; display: flex; flex-direction: column; }
.cv .gen .gt { font: 700 12px/1.15 Georgia, serif; display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
.cv .gen .ga { margin-top: auto; font-size: 9.5px; opacity: .85; }
.cv .fmt { position: absolute; z-index: 3; right: 5px; top: 5px; font: 800 8.5px/1 sans-serif; padding: 3px 5px; border-radius: 4px; background: rgba(0,0,0,.55); color: #fff; }
.cv .pr { position: absolute; z-index: 3; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(0,0,0,.35); } .cv .pr i { display: block; height: 100%; background: var(--accent); }
.cv .wait { position: absolute; inset: 0; z-index: 4; background: rgba(0,0,0,.5); color: #fff; display: grid; place-items: center; font-size: 11px; font-weight: 700; text-align: center; padding: 6px; }
.cv .ok { position: absolute; z-index: 3; left: 10%; bottom: 8px; width: 20px; height: 20px; border-radius: 50%; background: #16a34a; color: #fff; display: grid; place-items: center; font-size: 11px; }
.st { font-size: 12.5px; color: var(--muted); padding: 2px 2px 0; min-height: 18px; }
.empty { text-align: center; padding: 40px 18px; color: var(--muted); }
.empty .ic { font-size: 48px; } .empty b { display: block; color: var(--text); font-size: 17px; margin: 8px 0 6px; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-radius: 20px 20px 0 0; padding: 18px 18px 26px; box-shadow: 0 -10px 40px rgba(0,0,0,.3); transform: translateY(105%); transition: transform .22s; }
.sheet.on { transform: none; }
.dim { position: fixed; inset: 0; z-index: 19; background: rgba(0,0,0,.35); display: none; } .dim.on { display: block; }
.row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.row span { flex: 1; } .row small { display: block; color: var(--muted); font-size: 12.5px; }
.row input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--accent); }
</style></head>
<body>
<div class="hd"><span class="ic">📚</span><div><h2>Библиотека</h2><p id="sub">Книги в телефоне — читаются без связи</p></div><span class="sp"></span>
  <button class="btn sm" id="syncb">⟳</button><button class="btn sm" id="setb">⚙</button></div>
<div class="wrap">
  <div class="st" id="st"></div>
  <div id="contw" style="display:none"><div class="h">Продолжить</div><div class="cont" id="cont"></div></div>
  <div class="search"><input type="text" id="q" placeholder="Название или автор"></div>
  <div class="chips" id="chips"></div>
  <div class="grid" id="grid"></div>
</div>
<div class="dim" id="dim"></div>
<div class="sheet" id="sheet">
  <div style="font-weight:800;font-size:17px;margin-bottom:6px">Библиотека в телефоне</div>
  <label class="row"><span>Скачивать книги в фоне<small>Какие — решаете в SWDS: папки и полки с отметкой «📱 На телефон» и книги «Читаю»</small></span><input type="checkbox" id="en"></label>
  <label class="row"><span>Только по Wi-Fi<small>Прогресс чтения и цитаты уходят по любой сети</small></span><input type="checkbox" id="wifi"></label>
  <div class="row"><span>Занято<small id="used"></small></span><button class="btn sm danger" id="clear">Очистить</button></div>
  <button class="btn full" id="srv" style="margin-top:12px">Открыть библиотеку в SWDS</button>
</div>
<script src="app.js"></script>
<script>
let L = {books: []}, filter = "", q = "", busy = false;
const ICON = {pdf: "📕", xlsx: "📊", csv: "📊", ods: "📊", docx: "📄", odt: "📄", pptx: "📽", cbz: "🖼", txt: "📝", md: "📝"};
function hue(s) { let h = 0; for (const c of String(s || "")) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h % 360; }
function cover(b) {
  const fm = (b.fmt || "").toUpperCase().replace(".ZIP", "");
  const pr = b.progress > 0 && b.status !== "done" ? `<span class="pr"><i style="width:${Math.round(b.progress * 100)}%"></i></span>` : "";
  const ok = b.status === "done" ? '<span class="ok">✓</span>' : "";
  const wait = b.local ? "" : `<span class="wait">${b.removed ? "Удалена с телефона" : "⬇ ждёт скачивания"}</span>`;
  if (b.cover_file) return `<div class="cv"><img src="${esc(b.cover_file)}" alt="" loading="lazy"><span class="fmt">${esc(fm)}</span>${pr}${ok}${wait}</div>`;
  const h = hue((b.author || "") + b.title);
  return `<div class="cv" style="background:linear-gradient(160deg,hsl(${h} 48% 36%),hsl(${(h + 40) % 360} 52% 18%))"><div class="gen"><div class="gt">${esc(b.title)}</div><div class="ga">${esc(b.author || "")}</div></div><span class="fmt">${esc(fm)}</span>${pr}${ok}${wait}</div>`;
}
function plural(n, a, b, c) { const m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? a : m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14) ? b : c; }
function render() {
  const books = L.books.slice().sort((a, b) => (b.opened_at || 0) - (a.opened_at || 0) || String(a.title).localeCompare(b.title, "ru"));
  const local = books.filter(b => b.local).length;
  $("sub").textContent = books.length ? `${local} из ${books.length} ${plural(books.length, "книги", "книг", "книг")} в телефоне · ${human(L.bytes)}` : "Книги в телефоне — читаются без связи";
  $("st").textContent = L.status ? L.status + (L.total ? ` (${L.done}/${L.total})` : "") : (L.outbox ? `Ждут отправки на сервер: ${L.outbox}` : (L.synced_at ? "Обновлено " + new Date(L.synced_at).toLocaleString("ru", {day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"}) : ""));
  const reading = books.filter(b => b.local && b.status === "reading");
  $("contw").style.display = reading.length ? "" : "none";
  $("cont").innerHTML = reading.map(b => `<div class="cc" data-id="${b.id}">${cover(b)}<div class="bd"><b>${esc(b.title)}</b><small>${esc(b.author || "")}</small>
    <div class="bar"><i style="width:${Math.round((b.progress || 0) * 100)}%"></i></div><small>${Math.round((b.progress || 0) * 100)}%</small></div></div>`).join("");
  const groups = [["", "Все"], ["reading", "Читаю"], ["want", "Хочу"], ["done", "Прочитано"], ["pdf", "PDF"], ["table", "Таблицы"]];
  $("chips").innerHTML = groups.map(([k, l]) => `<button data-f="${k}" class="${filter === k ? "on" : ""}">${l}</button>`).join("");
  const ql = q.toLowerCase();
  const list = books.filter(b => (!filter || b.status === filter || b.fmt === filter || b.kind === filter) && (!ql || (b.title + " " + (b.author || "")).toLowerCase().includes(ql)));
  $("grid").innerHTML = list.length ? list.map(b => `<div class="bk" data-id="${b.id}">${cover(b)}<div class="t">${esc(b.title)}</div><div class="a">${esc(b.author || (b.fmt || "").toUpperCase())}</div></div>`).join("")
    : `<div class="empty" style="grid-column:1/-1"><div class="ic">📚</div><b>${books.length ? "Ничего не нашлось" : "Пока нет книг"}</b>${books.length ? "" :
      "В SWDS откройте «Библиотеку» → «📁 Папки» и отметьте «📱 На телефон» (или добавьте книгу на полку с отметкой 📱). Книги, которые вы читаете, скачиваются сами."}</div>`;
}
async function load() { const r = await P.call("lib_list"); if (r.ok) { L = r; render(); } return r; }
let pollT;
async function poll() { clearTimeout(pollT); const r = await load(); if (r.status) pollT = setTimeout(poll, 1200); }
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-id]");
  if (b) { const r = await P.call("open_reader", {id: b.dataset.id}); if (!r.ok) { toast(r.error); setTimeout(poll, 800); } return; }
  const f = e.target.closest("[data-f]"); if (f) { filter = f.dataset.f; render(); }
});
$("q").oninput = e => { q = e.target.value.trim(); render(); };
$("syncb").onclick = async () => { await P.call("lib_sync"); toast("Синхронизирую библиотеку…"); setTimeout(poll, 800); };
const sheet = on => { $("sheet").classList.toggle("on", on); $("dim").classList.toggle("on", on); };
$("setb").onclick = () => { const s = P.state(); $("en").checked = s.library_enabled !== false; $("wifi").checked = s.library_wifi_only !== false; $("used").textContent = human(L.bytes || 0); sheet(true); };
$("dim").onclick = () => sheet(false);
$("en").onchange = e => P.call("lib_set", {enabled: e.target.checked});
$("wifi").onchange = e => P.call("lib_set", {wifi_only: e.target.checked});
$("clear").onclick = async () => { if (!confirm("Удалить скачанные книги с телефона? Прогресс и цитаты сохранятся на сервере.")) return; await P.call("lib_clear"); sheet(false); load(); };
$("srv").onclick = () => P.call("open_main", {path: "/modules/library/window"});
P.on("resume", () => load());
load().then(r => { if (r.ok && (!r.synced_at || Date.now() - r.synced_at > 10 * 60000)) { P.call("lib_sync", {manual: false}); setTimeout(poll, 1500); } });
</script>
</body></html>
